services:
  protonvpn:
    image: ghcr.io/tprasadtp/protonwire:latest
    container_name: protonvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    env_file:
      - ../../.env.staging
    environment:
      - SKIP_DNS_CONFIG=1
    sysctls:
      net.ipv4.conf.all.rp_filter: 2
      net.ipv6.conf.all.disable_ipv6: 1
    volumes:
      - type: tmpfs
        target: /tmp
      - type: bind
        source: private.key
        target: /etc/protonwire/private-key
        read_only: true
    tty: true
    networks:
      - app-network

  app:
    build:
      context: ../../
      dockerfile: docker/staging/Dockerfile
    container_name: manga-xr-app
    env_file:
      - ../../.env.staging
    depends_on:
      - caddy
    network_mode: "service:protonvpn"

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    environment:
      - DEFAULT_BLOCK_ADS=true
      - MAX_CONCURRENT_SESSIONS=5
      - PREBOOT_CHROME=true
      - PORT=3001
    network_mode: "service:protonvpn"

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      app-network: {}
      # port 3000 external host is mapped to port 3000 of the caddy container, but that port is also mapped to the port 3000 of protonvpn (port of the app) in the Caddyfile
      # port 3001 external host is mapped to port 3001 of the caddy container, but that port is also mapped to the port 3001 of protonvpn (port of the browserless service) in the Caddyfile
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"

  mongodb-primary:
    image: bitnami/mongodb:latest
    container_name: mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_NAME=rs0
      - MONGODB_ADVERTISED_HOSTNAME=mongodb-primary
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_ROOT_PASSWORD=password
      - MONGODB_REPLICA_SET_KEY=replicasetkey123
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - manga-xr-staging-db:/bitnami
    networks:
      - app-network

  mongodb-secondary:
    image: bitnami/mongodb:latest
    container_name: mongodb-secondary
    depends_on:
      - mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_NAME=rs0
      - MONGODB_ADVERTISED_HOSTNAME=mongodb-secondary
      - MONGODB_REPLICA_SET_MODE=secondary
      - MONGODB_INITIAL_PRIMARY_HOST=mongodb-primary
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=password
      - MONGODB_REPLICA_SET_KEY=replicasetkey123
    ports:
      - "127.0.0.1:27027:27017"
    networks:
      - app-network

  mongodb-arbiter:
    image: bitnami/mongodb:latest
    container_name: mongodb-arbiter
    depends_on:
      - mongodb-primary
    environment:
      - MONGODB_REPLICA_SET_NAME=rs0
      - MONGODB_ADVERTISED_HOSTNAME=mongodb-arbiter
      - MONGODB_REPLICA_SET_MODE=arbiter
      - MONGODB_INITIAL_PRIMARY_HOST=mongodb-primary
      - MONGODB_INITIAL_PRIMARY_PORT_NUMBER=27017
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=password
      - MONGODB_REPLICA_SET_KEY=replicasetkey123
    ports:
      - "127.0.0.1:27037:27017"
    networks:
      - app-network

volumes:
  manga-xr-staging-db:
    driver: local

networks:
  app-network:
    driver: bridge
